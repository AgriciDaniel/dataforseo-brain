name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall scripts dataforseo_brain tests
      - name: CLI smoke
        run: dataforseo-brain --help
      - name: Template vault lint
        run: python scripts/lint_vault.py --vault assets/template-brain --template
      - name: Tests
        run: python -m pytest -q
