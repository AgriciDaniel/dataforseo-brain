[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforseo-brain"
version = "1.0.1"
description = "DataForSEO Brain Obsidian brain template and script layer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Daniel Agrici"}]
dependencies = []

[project.scripts]
dataforseo-brain = "dataforseo_brain.cli:main"

[tool.setuptools]
packages = ["dataforseo_brain"]
